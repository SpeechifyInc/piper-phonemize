[build-system]
requires = ["setuptools>=42", "pybind11>=2.10.0", "cmake>=3.14"]
build-backend = "setuptools.build_meta"

[project]
name = "piper-phonemize"
version = "1.2.0"
description = "Phonemization libary used by Piper text to speech system"
authors = [{ name = "Michael Hansen", email = "mike@rhasspy.org" }]
requires-python = ">=3.7"

[project.urls]
Homepage = "https://github.com/rhasspy/piper-phonemize"

[tool.setuptools.packages.find]
where = ["."]
include = ["piper_phonemize*"]

[tool.setuptools.package-data]
piper_phonemize = ["espeak-ng-data/**/*", "libtashkeel_model.ort"]
